<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロ仕様！プレミアム カスタムアイコンメーカー</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: rgba(26, 29, 36, 0.85);
            --card-bg: #222630;
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --accent-orange: #ff9f43;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 159, 67, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .workspace {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            flex: 1;
            min-width: 360px;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-group {
            margin-bottom: 16px;
            padding: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: border-color 0.2s;
        }

        .control-group:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .control-group input[type="text"], 
        .control-group select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #14171f;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .control-group input[type="text"]:focus, 
        .control-group select:focus,
        textarea:focus {
            border-color: var(--accent-primary);
        }

        .add-form-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .add-form-wrapper input[type="text"], 
        .add-form-wrapper select {
            flex: 1;
        }

        button {
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-add {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.25);
        }
        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 242, 254, 0.35);
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            background: #14171f;
            border-radius: 3px;
            outline: none;
            accent-color: var(--accent-orange);
            margin: 8px 0;
        }

        .range-val {
            color: var(--accent-orange);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .selected-badge {
            font-size: 0.9rem;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 14px;
            text-align: center;
            background: #14171f;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--accent-orange);
        }

        .save-zone {
            background: rgba(255, 159, 67, 0.05);
            border: 1px solid rgba(255, 159, 67, 0.3);
            padding: 18px;
            border-radius: 14px;
            margin-top: 20px;
        }

        .json-zone {
            background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 18px;
            border-radius: 14px;
            margin-top: 20px;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9f43, #ff5252);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 159, 67, 0.35);
            margin-top: 10px;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 159, 67, 0.45);
        }

        .btn-json {
            padding: 10px 14px;
            background: #1e293b;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }
        .btn-json:hover {
            background: var(--accent-primary);
            color: #0f172a;
        }

        .btn-delete {
            width: 100%;
            padding: 10px;
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .btn-delete:hover:not(:disabled) {
            background: #ff5252;
            color: white;
        }
        .btn-delete:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 20px;
        }

        .canvas-wrapper {
            position: relative;
            background: #000;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
            width: 340px;
            height: 340px;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        .hint {
            margin-top: 16px;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            max-width: 340px;
            background: var(--panel-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* カスタムカラーインプット */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ プレミアム アイコンメーカー</h1>
        <p>画像・多彩な図形・文字を組み合わせてプロ級アイコンを作成！ (≧∇≦)b</p>
    </header>

    <div class="workspace">
        
        <div class="control-panel">
            
            <div class="section-title">🛠️ ベース ＆ アセット追加</div>

            <div class="control-group">
                <label>🎨 アイコン全体の背景色：</label>
                <input type="color" id="bgColor" value="#0f172a">
            </div>

            <div class="control-group">
                <label>🖼️ 画像を追加：</label>
                <input type="file" id="imageUpload" accept="image/*" style="width:100%; color: #ccc; font-size: 0.85rem;">
            </div>

            <div class="control-group">
                <label>🔷 図形を追加 (8種類)：</label>
                <div class="add-form-wrapper">
                    <select id="shapeSelect">
                        <option value="rect">四角形 (Square)</option>
                        <option value="circle">円 (Circle)</option>
                        <option value="triangle">三角形 (Triangle)</option>
                        <option value="star">★ 星形 (Star)</option>
                        <option value="hexagon">六角形 (Hexagon)</option>
                        <option value="heart">♥ ハート (Heart)</option>
                        <option value="diamond">◆ ダイヤ (Diamond)</option>
                        <option value="capsule">カプセル (Capsule)</option>
                    </select>
                    <button class="btn-add" id="addShapeBtn">追加</button>
                </div>
            </div>

            <div class="control-group">
                <label>➕ 文字・絵文字を追加：</label>
                <div class="add-form-wrapper">
                    <input type="text" id="charInput" value="👑" placeholder="文字や絵文字">
                    <button class="btn-add" id="addBtn">追加</button>
                </div>
            </div>

            <div class="section-title" style="margin-top:24px;">🎛️ 選択パーツの編集</div>

            <div class="control-group">
                <div class="selected-badge" id="selectedLabel">選択中: なし (キャンバス上の要素をクリック！)</div>

                <div id="fontControls" style="display:none; margin-bottom: 12px;">
                    <label>🅰️ フォントの選択：</label>
                    <select id="fontSelect">
                        <option value="'Segoe UI', sans-serif">標準ゴシック (sans-serif)</option>
                        <option value="'Yu Mincho', 'MS Mincho', serif">明朝体 (serif)</option>
                        <option value="'Comic Sans MS', cursive">カジュアル (Comic Sans)</option>
                        <option value="'Impact', sans-serif">インパクト (Impact)</option>
                        <option value="'Courier New', monospace">等幅 (monospace)</option>
                    </select>
                </div>
                
                <div id="colorControls">
                    <label id="colorLabel">① 色（カラー）：</label>
                    <input type="color" id="elementColor" value="#00ecbc" style="margin-bottom:12px;">
                </div>

                <label id="widthLabel">② 横幅 (Width)：<span class="range-val" id="widthVal">150px</span></label>
                <input type="range" id="widthSlider" min="10" max="600" value="150">

                <div id="heightControlGroup" style="margin-top: 12px;">
                    <label id="heightLabel">③ 縦幅 (Height)：<span class="range-val" id="heightVal">150px</span></label>
                    <input type="range" id="heightSlider" min="10" max="600" value="150">
                </div>

                <label style="margin-top: 12px;">④ 回転角度 (-180° 〜 180°)：<span class="range-val" id="rotateVal">0°</span></label>
                <input type="range" id="rotateSlider" min="-180" max="180" value="0">

                <button class="btn-delete" id="deleteBtn">❌ この要素を削除する</button>
            </div>

                <label style="font-size: 0.85rem; font-weight: 700; color: var(--accent-primary); display: block; margin-bottom: 8px;">💾 JSONセーブ / 📋 コピペ復元 (サーバー非経由)</label>

        const colorLabel = document.getElementById('colorLabel');
        const elementColor = document.getElementById('elementColor');
        const widthLabel = document.getElementById('widthLabel');
        const widthSlider = document.getElementById('widthSlider');
        const heightControlGroup = document.getElementById('heightControlGroup');
        const heightLabel = document.getElementById('heightLabel');
        const heightSlider = document.getElementById('heightSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const widthVal = document.getElementById('widthVal');
        const heightVal = document.getElementById('heightVal');
        const rotateVal = document.getElementById('rotateVal');
        const deleteBtn = document.getElementById('deleteBtn');
        const fileNameInput = document.getElementById('fileNameInput');
        const saveBtn = document.getElementById('saveBtn');

        // JSONセーブ・ロード関連要素
        const jsonTextArea = document.getElementById('jsonTextArea');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const importJsonBtn = document.getElementById('importJsonBtn');
        const downloadJsonBtn = document.getElementById('downloadJsonBtn');
        const uploadJsonFile = document.getElementById('uploadJsonFile');

        let backgroundColor = '#0f172a';

        // 初期レイヤー
        let layers = [
            { id: 1, type: 'shape', shapeType: 'star', x: 256, y: 256, width: 280, height: 280, rotation: 0, color: '#ff9f43' },
            { id: 2, type: 'text', text: '👑', fontFamily: "'Segoe UI', sans-serif", x: 256, y: 240, width: 160, height: 160, rotation: 0, color: '#ffffff' }
        ];

        let selectedId = 2; 
        let isDragging = false;
        let dragTarget = null;
        let startX, startY;

        // --- 図形パス描画の共通化 ---
        function createShapePath(layer) {
            const path = new Path2D();
            const w = layer.width;
            const h = layer.height;
            const hw = w / 2;
            const hh = h / 2;

            switch (layer.shapeType) {
                case 'rect':
                    path.rect(-hw, -hh, w, h);
                    break;

                case 'circle':
                    path.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
                    break;

                case 'triangle':
                    path.moveTo(0, -hh);
                    path.lineTo(hw, hh);
                    path.lineTo(-hw, hh);
                    path.closePath();
                    break;

                case 'star': {
                    const spikes = 5;
                    const outerRadius = Math.min(hw, hh);
                    const innerRadius = outerRadius * 0.4;
                    let rot = (Math.PI / 2) * 3;
                    const step = Math.PI / spikes;

                    path.moveTo(0, -outerRadius);
                    for (let i = 0; i < spikes; i++) {
                        path.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
                        rot += step;
                        path.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
                        rot += step;
                    }
                    path.closePath();
                    break;
                }

                case 'hexagon': {
                    const radius = Math.min(hw, hh);
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 6;
                        const x = Math.cos(angle) * radius * (w / Math.max(w, h));
                        const y = Math.sin(angle) * radius * (h / Math.max(w, h));
                        if (i === 0) path.moveTo(x, y);
                        else path.lineTo(x, y);
                    }
                    path.closePath();
                    break;
                }

                case 'heart': {
                    path.moveTo(0, hh * 0.7);
                    path.bezierCurveTo(-hw * 1.2, 0, -hw * 0.6, -hh, 0, -hh * 0.3);
                    path.bezierCurveTo(hw * 0.6, -hh, hw * 1.2, 0, 0, hh * 0.7);
                    path.closePath();
                    break;
                }

                case 'diamond':
                    path.moveTo(0, -hh);
                    path.lineTo(hw, 0);
                    path.lineTo(0, hh);
                    path.lineTo(-hw, 0);
                    path.closePath();
                    break;

                case 'capsule': {
                    const r = Math.min(hw, hh);
                    if (w >= h) {
                        path.arc(hw - hh, 0, hh, -Math.PI/2, Math.PI/2);
                        path.arc(-hw + hh, 0, hh, Math.PI/2, (Math.PI/2)*3);
                    } else {
                        path.arc(0, hh - hw, hw, 0, Math.PI);
                        path.arc(0, -hh + hw, hw, Math.PI, 0);
                    }
                    path.closePath();
                    break;
                }
            }
            return path;
        }

        // キャンバス全体の描画
        function drawIcon() {
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            layers.forEach(layer => {
                ctx.save();
                ctx.translate(layer.x, layer.y);
                ctx.rotate((layer.rotation * Math.PI) / 180);

                if (layer.type === 'text') {
                    const family = layer.fontFamily || "'Segoe UI', sans-serif";
                    ctx.font = `bold ${layer.width}px ${family}`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = layer.color;
                    ctx.fillText(layer.text, 0, 0);
                } else if (layer.type === 'image' && layer.imgObj) {
                    ctx.drawImage(layer.imgObj, -layer.width / 2, -layer.height / 2, layer.width, layer.height);
                } else if (layer.type === 'shape') {
                    ctx.fillStyle = layer.color;
                    const path = createShapePath(layer);
                    ctx.fill(path);
                }

                // 選択中パーツのガイドライン表示
                if (layer.id === selectedId) {
                    ctx.strokeStyle = '#ff9f43';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 6]);

                    if (layer.type === 'shape') {
                        const path = createShapePath(layer);
                        ctx.stroke(path);
                    } else if (layer.type === 'image') {
                        ctx.strokeRect(-layer.width / 2, -layer.height / 2, layer.width, layer.height);
                    } else if (layer.type === 'text') {
                        const hw = (layer.width * 0.8) / 2;
                        const hh = (layer.height * 0.8) / 2;
                        ctx.strokeRect(-hw, -hh, hw * 2, hh * 2);
                    }

                    ctx.setLineDash([]);
                }

                ctx.restore();
            });
        }

        // UI表示の切り替え
        function updateUI() {
            bgColorInput.value = backgroundColor;

            const currentLayer = layers.find(l => l.id === selectedId);
            if (currentLayer) {
                if (currentLayer.type === 'text') {
                    selectedLabel.textContent = `選択中 (文字): 「${currentLayer.text}」`;
                    fontControls.style.display = 'block';
                    fontSelect.value = currentLayer.fontFamily || "'Segoe UI', sans-serif";
                    colorControls.style.display = 'block';
                    colorLabel.textContent = '① 文字の色：';
                    widthLabel.innerHTML = `② 文字サイズ (フォント)：<span class="range-val" id="widthVal">${currentLayer.width}px</span>`;
                    heightControlGroup.style.display = 'none';
                } else if (currentLayer.type === 'image') {
                    selectedLabel.textContent = `選択中 (画像)`;
                    fontControls.style.display = 'none';
                    colorControls.style.display = 'none';
                    widthLabel.innerHTML = `② 横幅 (Width)：<span class="range-val" id="widthVal">${currentLayer.width}px</span>`;
                    heightControlGroup.style.display = 'block';
                    heightLabel.innerHTML = `③ 縦幅 (Height)：<span class="range-val" id="heightVal">${currentLayer.height}px</span>`;
                } else if (currentLayer.type === 'shape') {
                    const names = { rect:'四角形', circle:'円', triangle:'三角形', star:'星形', hexagon:'六角形', heart:'ハート', diamond:'ダイヤ', capsule:'カプセル' };
                    selectedLabel.textContent = `選択中 (図形: ${names[currentLayer.shapeType] || currentLayer.shapeType})`;
                    fontControls.style.display = 'none';
                    colorControls.style.display = 'block';
                    colorLabel.textContent = '① 図形の色：';
                    widthLabel.innerHTML = `② 横幅 (Width)：<span class="range-val" id="widthVal">${currentLayer.width}px</span>`;
                    heightControlGroup.style.display = 'block';
                    heightLabel.innerHTML = `③ 縦幅 (Height)：<span class="range-val" id="heightVal">${currentLayer.height}px</span>`;
                }
                
                elementColor.value = currentLayer.color || '#ffffff';
                widthSlider.value = currentLayer.width;
                heightSlider.value = currentLayer.height;
                rotateSlider.value = currentLayer.rotation;
                rotateVal.textContent = `${currentLayer.rotation}°`;
                
                widthSlider.disabled = false;
                heightSlider.disabled = false;
                rotateSlider.disabled = false;
                deleteBtn.disabled = false;
            } else {
                selectedLabel.textContent = `選択中: なし (要素をクリックしてな)`;
                fontControls.style.display = 'none';
                widthVal.textContent = `---`;
                heightVal.textContent = `---`;
                rotateVal.textContent = `---`;
                widthSlider.disabled = true;
                heightSlider.disabled = true;
                rotateSlider.disabled = true;
                deleteBtn.disabled = true;
            }
        }

        // --- イベントリスナー ---

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const newLayer = {
                        id: Date.now(),
                        type: 'image',
                        imgObj: img,
                        imgSrc: event.target.result, // JSON保存用Base64データ
                        x: 256,
                        y: 256,
                        width: 200,
                        height: 200,
                        rotation: 0
                    };
                    layers.push(newLayer);
                    selectedId = newLayer.id;
                    imageUpload.value = '';
                    updateUI();
                    drawIcon();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        addShapeBtn.addEventListener('click', () => {
            const newLayer = {
                id: Date.now(),
                type: 'shape',
                shapeType: shapeSelect.value,
                x: 256,
                y: 256,
                width: 160,
                height: 160,
                rotation: 0,
                color: '#00ecbc'
            };
            layers.push(newLayer);
            selectedId = newLayer.id;
            updateUI();
            drawIcon();
        });

        addBtn.addEventListener('click', () => {
            const val = charInput.value.trim();
            if (!val) return;
            const newLayer = {
                id: Date.now(),
                type: 'text',
                text: val,
                fontFamily: fontSelect.value || "'Segoe UI', sans-serif",
                x: 256,
                y: 256,
                width: 150,
                height: 150,
                rotation: 0,
                color: '#ffffff'
            };
            layers.push(newLayer);
            selectedId = newLayer.id;
            charInput.value = '';
            updateUI();
            drawIcon();
        });

        fontSelect.addEventListener('change', (e) => {
            const currentLayer = layers.find(l => l.id === selectedId);
            if (currentLayer && currentLayer.type === 'text') {
                currentLayer.fontFamily = e.target.value;
                drawIcon();
            }
        });

        bgColorInput.addEventListener('input', (e) => {
            backgroundColor = e.target.value;
            drawIcon();
        });

        function handleSliderInput() {
            const currentLayer = layers.find(l => l.id === selectedId);
            if (currentLayer) {
                currentLayer.width = parseInt(widthSlider.value);
                currentLayer.height = parseInt(heightSlider.value);
                currentLayer.rotation = parseInt(rotateSlider.value);
                if (currentLayer.type !== 'image') {
                    currentLayer.color = elementColor.value;
                }
                
                widthVal.textContent = `${currentLayer.width}px`;
                heightVal.textContent = `${currentLayer.height}px`;
                rotateVal.textContent = `${currentLayer.rotation}°`;
                
                drawIcon();
            }
        }

        elementColor.addEventListener('input', handleSliderInput);
        widthSlider.addEventListener('input', handleSliderInput);
        heightSlider.addEventListener('input', handleSliderInput);
        rotateSlider.addEventListener('input', handleSliderInput);

        deleteBtn.addEventListener('click', () => {
            layers = layers.filter(l => l.id !== selectedId);
            selectedId = layers.length > 0 ? layers[layers.length - 1].id : null;
            updateUI();
            drawIcon();
        });

        // 座標変換
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        // 精密判定
        function isPointInLayer(layer, pointX, pointY) {
            const dx = pointX - layer.x;
            const dy = pointY - layer.y;
            const rad = (-layer.rotation * Math.PI) / 180;
            const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

            const hw = layer.width / 2;
            const hh = layer.height / 2;

            if (layer.type === 'shape') {
                const path = createShapePath(layer);
                return ctx.isPointInPath(path, localX, localY);
            } else if (layer.type === 'image') {
                return Math.abs(localX) <= hw && Math.abs(localY) <= hh;
            } else if (layer.type === 'text') {
                return Math.abs(localX) <= hw * 0.8 && Math.abs(localY) <= hh * 0.8;
            }
            return false;
        }

        function startDrag(e) {
            const coords = getCanvasCoords(e);
            let hitTarget = null;

            for (let i = layers.length - 1; i >= 0; i--) {
                if (isPointInLayer(layers[i], coords.x, coords.y)) {
                    hitTarget = layers[i];
                    break;
                }
            }

            if (hitTarget) {
                isDragging = true;
                dragTarget = hitTarget;
                selectedId = hitTarget.id;
                startX = coords.x - dragTarget.x;
                startY = coords.y - dragTarget.y;
                updateUI();
                drawIcon();
            } else {
                selectedId = null;
                updateUI();
                drawIcon();
            }
        }

        function moveDrag(e) {
            if (!isDragging || !dragTarget) return;
            e.preventDefault();
            const coords = getCanvasCoords(e);
            dragTarget.x = coords.x - startX;
            dragTarget.y = coords.y - startY;
            drawIcon();
        }

        function stopDrag() {
            isDragging = false;
            dragTarget = null;
        }

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', stopDrag);
        canvas.addEventListener('touchstart', startDrag);
        canvas.addEventListener('touchmove', moveDrag, { passive: false });
        canvas.addEventListener('touchend', stopDrag);

        // PNG画像保存処理
        saveBtn.addEventListener('click', () => {
            const tempSelectedId = selectedId;
            selectedId = null;
            drawIcon();

            const dataURL = canvas.toDataURL('image/png');
            let inputName = fileNameInput.value.trim();
            let finalFileName = inputName ? `${inputName}.png` : `custom-icon-${Date.now()}.png`;

            const link = document.createElement('a');
            link.download = finalFileName;
            link.href = dataURL;
            link.click();

            selectedId = tempSelectedId;
            drawIcon();
        });

        // ==========================================
        // ⭐ サーバー費完全0円！JSON セーブ ＆ ロード機能 ⭐
        // ==========================================

        // JSONデータ文字列の生成処理
        function generateJsonString() {
            const exportLayers = layers.map(l => {
                const copy = { ...l };
                delete copy.imgObj; // HTMLImageElementはシリアライズできないので削除
                return copy;
            });
            const saveData = {
                backgroundColor: backgroundColor,
                layers: exportLayers
            };
            return JSON.stringify(saveData, null, 2);
        }

        // 1. JSON生成＆クリップボードコピー
        exportJsonBtn.addEventListener('click', () => {
            const jsonStr = generateJsonString();
            jsonTextArea.value = jsonStr;
            navigator.clipboard.writeText(jsonStr).then(() => {
                alert("📋 JSONデータをクリップボードにコピーしたで！\nメモ帳などに貼り付けて保存してな！");
            }).catch(() => {
                alert("JSONを生成したで！下のテキストエリアからコピペしてな！");
            });
        });

        // 2. JSONファイルとしてダウンロード保存
        downloadJsonBtn.addEventListener('click', () => {
            const jsonStr = generateJsonString();
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `icon-project-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // JSONデータ構造をレイヤーオブジェクト群へと復元する関数
        function loadJsonData(jsonData) {
            try {
                if (!jsonData || !Array.isArray(jsonData.layers)) {
                    alert("⚠️ 無効なJSONフォーマットやで！");
                    return;
                }
                backgroundColor = jsonData.backgroundColor || '#0f172a';
                
                const loadedLayers = [];
                let pendingImages = 0;

                jsonData.layers.forEach(l => {
                    if (l.type === 'image' && l.imgSrc) {
                        pendingImages++;
                        const img = new Image();
                        img.onload = () => {
                            l.imgObj = img;
                            pendingImages--;
                            if (pendingImages === 0) {
                                layers = loadedLayers;
                                selectedId = layers.length > 0 ? layers[layers.length - 1].id : null;
                                updateUI();
                                drawIcon();
                            }
                        };
                        img.src = l.imgSrc;
                        loadedLayers.push(l);
                    } else {
                        loadedLayers.push(l);
                    }
                });

                if (pendingImages === 0) {
                    layers = loadedLayers;
                    selectedId = layers.length > 0 ? layers[layers.length - 1].id : null;
                    updateUI();
                    drawIcon();
                }
                alert("✨ デザインを復元したで！");
            } catch (err) {
                alert("⚠️ JSONの解析に失敗したで。正しいデータか確認してな！");
            }
        }

        // 3. テキストエリアのJSONから復元
        importJsonBtn.addEventListener('click', () => {
            const str = jsonTextArea.value.trim();
            if (!str) {
                alert("⚠️ テキストエリアにJSONを貼り付けてから押してな！");
                return;
            }
            try {
                const parsed = JSON.parse(str);
                loadJsonData(parsed);
            } catch (e) {
                alert("⚠️ JSONの書き方が正しくないみたいやで！");
            }
        });

        // 4. JSONファイルを開いて復元
        uploadJsonFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    loadJsonData(parsed);
                    jsonTextArea.value = event.target.result;
                } catch (err) {
                    alert("⚠️ ファイルが正しいJSONではありません！");
                }
            };
            reader.readAsText(file);
        });

        // 初期表示
        updateUI();
        drawIcon();
    </script>
</body>
</html>
