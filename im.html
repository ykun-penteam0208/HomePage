<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロ仕様！マルチ文字アイコンメーカー</title>
    <style>
        /* --- 全体のデザイン（クリエイティブなダークテーマ） --- */
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #00ecbc;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            color: #ff9f43;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        /* ワークスペース（横並びレイアウト） */
        .workspace {
            display: flex;
            gap: 30px;
            max-width: 1050px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* --- 左側：コントロールパネル --- */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            flex: 1;
            min-width: 340px;
            box-sizing: border-box;
        }

        .control-group {
            margin-bottom: 15px;
            padding: 12px;
            background: #252530;
            border-radius: 8px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #a4b0be;
        }

        .control-group input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #121214;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* 文字追加用の特殊横並び */
        .add-form-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-form-wrapper input[type="text"] {
            flex: 1;
        }

        .control-group button.btn-add {
            padding: 10px 16px;
            background-color: #00ecbc;
            color: #121214;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff9f43;
        }

        .range-val {
            float: right;
            color: #ff9f43;
            font-size: 0.85rem;
        }

        /* 選択中の文字表示バッジ */
        .selected-badge {
            font-size: 0.9rem;
            color: #ff9f43;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
            background: #121214;
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed #ff9f43;
        }

        /* 保存エリア */
        .save-zone {
            background: #1a1a24;
            border: 2px solid #ff9f43;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9f43, #ff5252);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
        }
        .btn-save:hover { opacity: 0.9; }
        .btn-save:active { transform: scale(0.98); }

        .btn-delete {
            width: 100%;
            padding: 8px;
            background-color: #ff5252;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }

        /* --- 右側：キャンバス表示エリア --- */
        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #000;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 4px solid #333;
            width: 320px;
            height: 320px;
        }

        canvas {
            display: block;
        }

        /* 操作のヒント */
        .hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #747d8c;
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <h1>🎨 プロ仕様！個別カスタムアイコンメーカー</h1>
    <p>文字スケール制限大幅UP！保存するPNGファイル名も自由に入力できるやで！</p>

    <div class="workspace">
        
        <div class="control-panel">
            
            <div class="control-group">
                <label>🎨 アイコン全体の背景色：</label>
                <input type="color" id="bgColor" value="#0f172a" style="width:100%; height:35px; border:none; cursor:pointer;">
            </div>

            <div class="control-group">
                <label>➕ 文字・絵文字を追加：</label>
                <div class="add-form-wrapper">
                    <input type="text" id="charInput" value="👑" placeholder="文字や絵文字">
                    <button class="btn-add" id="addBtn">追加する</button>
                </div>
            </div>

            <div class="control-group" style="border: 1px solid #444;">
                <div class="selected-badge" id="selectedLabel">選択中: なし (キャンバスの文字をクリック！)</div>
                
                <label>① 文字の色（絵文字には無効）：</label>
                <input type="color" id="charColor" value="#00ecbc" style="width:100%; height:35px; border:none; cursor:pointer; margin-bottom:12px;">

                <label>② 文字の大きさ (最大600)：<span class="range-val" id="scaleVal">150px</span></label>
                <input type="range" id="scaleSlider" min="20" max="600" value="150">

                <label style="margin-top: 12px;">③ 回転角度 (-180° 〜 180°)：<span class="range-val" id="rotateVal">0°</span></label>
                <input type="range" id="rotateSlider" min="-180" max="180" value="0">

                <button class="btn-delete" id="deleteBtn">❌ この文字を消去する</button>
            </div>

            <div class="save-zone">
                <label style="font-size: 0.85rem; font-weight: bold; color: #ff9f43; display: block; margin-bottom: 6px;">💾 保存するPNGのファイル名：</label>
                <input type="text" id="fileNameInput" placeholder="例: my_cool_icon (空欄なら自動命名)">
                <button class="btn-save" id="saveBtn">📥 PNG画像として保存する！</button>
            </div>
        </div>

        <div class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="iconCanvas" width="512" height="512" style="width:320px; height:320px;"></canvas>
            </div>
            <div class="hint">
                【操作方法】<br>
                ✨ **文字をクリック**：その文字をカスタム対象に選択！<br>
                ✨ **文字をドラッグ**：選んだ文字を別々に移動 ↕↔<br>
                ✨ **スライダー**：選んだ文字の回転・ドデカ拡大を個別調整！
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        // 要素の取得
        const bgColorInput = document.getElementById('bgColor');
        const charInput = document.getElementById('charInput');
        const addBtn = document.getElementById('addBtn');
        const selectedLabel = document.getElementById('selectedLabel');
        const charColorInput = document.getElementById('charColor');
        const scaleSlider = document.getElementById('scaleSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const scaleVal = document.getElementById('scaleVal');
        const rotateVal = document.getElementById('rotateVal');
        const deleteBtn = document.getElementById('deleteBtn');
        const fileNameInput = document.getElementById('fileNameInput');
        const saveBtn = document.getElementById('saveBtn');

        // 全体の背景色
        let backgroundColor = '#0f172a';

        // 初期配置の文字データ（今回はちょっとドデカく配置！）
        let charLayers = [
            { id: 1, text: 'A', x: 160, y: 240, scale: 220, rotation: -15, color: '#ff9f43' },
            { id: 2, text: 'Z', x: 340, y: 260, scale: 220, rotation: 15, color: '#00ecbc' },
            { id: 3, text: '👑', x: 256, y: 120, scale: 140, rotation: 0, color: '#ffffff' }
        ];

        let selectedId = 1; 
        let isDragging = false;
        let dragTarget = null;
        let startX, startY;

        // --- キャンバスの描画メイン関数 ---
        function drawIcon() {
            // 背景塗りつぶし
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 全レイヤー描画
            charLayers.forEach(layer => {
                ctx.save();
                
                ctx.translate(layer.x, layer.y);
                ctx.rotate((layer.rotation * Math.PI) / 180);

                ctx.font = `bold ${layer.scale}px 'Helvetica Neue', Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = layer.color;

                // 選択中の文字には、ガイドの点線円を描く
                if (layer.id === selectedId) {
                    ctx.beginPath();
                    ctx.arc(0, 0, layer.scale / 1.4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 159, 67, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.fillText(layer.text, 0, 0);
                ctx.restore();
            });
        }

        // --- UI表示とスライダー・数値の同期 ---
        function updateUI() {
            const currentLayer = charLayers.find(l => l.id === selectedId);
            if (currentLayer) {
                selectedLabel.textContent = `選択中:「${currentLayer.text}」`;
                charColorInput.value = currentLayer.color;
                
                scaleSlider.value = currentLayer.scale;
                scaleVal.textContent = `${currentLayer.scale}px`;

                rotateSlider.value = currentLayer.rotation;
                rotateVal.textContent = `${currentLayer.rotation}°`;
                
                charColorInput.disabled = false;
                scaleSlider.disabled = false;
                rotateSlider.disabled = false;
                deleteBtn.disabled = false;
            } else {
                selectedLabel.textContent = `選択中: なし (文字をクリックしてな)`;
                scaleVal.textContent = `---`;
                rotateVal.textContent = `---`;
                charColorInput.disabled = true;
                scaleSlider.disabled = true;
                rotateSlider.disabled = true;
                deleteBtn.disabled = true;
            }
        }

        // --- 文字追加 ---
        addBtn.addEventListener('click', () => {
            const val = charInput.value.trim();
            if (!val) return;

            const newLayer = {
                id: Date.now(),
                text: val,
                x: 256,
                y: 256,
                scale: 150, // 初期サイズもちょっと大きめに
                rotation: 0,
                color: '#ffffff'
            };

            charLayers.push(newLayer);
            selectedId = newLayer.id;
            charInput.value = '';
            
            updateUI();
            drawIcon();
        });

        // 背景色変更
        bgColorInput.addEventListener('input', (e) => {
            backgroundColor = e.target.value;
            drawIcon();
        });

        // スライダー連動
        function handleSliderInput() {
            const currentLayer = charLayers.find(l => l.id === selectedId);
            if (currentLayer) {
                currentLayer.color = charColorInput.value;
                currentLayer.scale = parseInt(scaleSlider.value);
                currentLayer.rotation = parseInt(rotateSlider.value);
                
                // 数値表示のテキストもリアルタイム更新や！
                scaleVal.textContent = `${currentLayer.scale}px`;
                rotateVal.textContent = `${currentLayer.rotation}°`;
                
                drawIcon();
            }
        }

        charColorInput.addEventListener('input', handleSliderInput);
        scaleSlider.addEventListener('input', handleSliderInput);
        rotateSlider.addEventListener('input', handleSliderInput);

        // 文字削除
        deleteBtn.addEventListener('click', () => {
            charLayers = charLayers.filter(l => l.id !== selectedId);
            selectedId = charLayers.length > 0 ? charLayers[0].id : null;
            updateUI();
            drawIcon();
        });

        // --- ドラッグ＆クリック選択判定 ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        function startDrag(e) {
            const coords = getCanvasCoords(e);
            let hitTarget = null;
            
            for (let i = charLayers.length - 1; i >= 0; i--) {
                const layer = charLayers[i];
                const distance = Math.sqrt((coords.x - layer.x) ** 2 + (coords.y - layer.y) ** 2);
                
                // ヒットエリアもスケールに合わせて柔軟に計算
                if (distance < layer.scale / 1.1) {
                    hitTarget = layer;
                    break;
                }
            }

            if (hitTarget) {
                isDragging = true;
                dragTarget = hitTarget;
                selectedId = hitTarget.id;
                startX = coords.x - dragTarget.x;
                startY = coords.y - dragTarget.y;
                
                updateUI();
                drawIcon();
            }
        }

        function moveDrag(e) {
            if (!isDragging || !dragTarget) return;
            e.preventDefault();
            const coords = getCanvasCoords(e);
            dragTarget.x = coords.x - startX;
            dragTarget.y = coords.y - startY;
            drawIcon();
        }

        function stopDrag() {
            isDragging = false;
            dragTarget = null;
        }

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', stopDrag);

        canvas.addEventListener('touchstart', startDrag);
        canvas.addEventListener('touchmove', moveDrag, { passive: false });
        canvas.addEventListener('touchend', stopDrag);


        // --- 💾 PNG保存処理（ファイル名カスタム入力対応！） ---
        saveBtn.addEventListener('click', () => {
            // 保存時は一時的にガイドの点線を非表示にする
            const tempSelectedId = selectedId;
            selectedId = null; 
            drawIcon();

            // Canvasから画像データを生成
            const dataURL = canvas.toDataURL('image/png');
            
            // ファイル名入力欄からテキストを取得（前後の余計な空白はカット）
            let inputName = fileNameInput.value.trim();
            let finalFileName = '';

            if (inputName) {
                // あんたが名前を入力してくれたらそれを使う！（拡張子は自動付与）
                finalFileName = `${inputName}.png`;
            } else {
                // 空欄やったら、今まで通りタイムスタンプで被らん名前を自動生成！
                finalFileName = `custom-icon-${Date.now()}.png`;
            }

            // ダウンロード用リンクを作って発火！
            const link = document.createElement('a');
            link.download = finalFileName;
            link.href = dataURL;
            link.click();

            // 保存完了後に選択状態を復元して再描画
            selectedId = tempSelectedId;
            drawIcon();
        });

        // 初期起動
        updateUI();
        drawIcon();
    </script>
</body>
</html>
