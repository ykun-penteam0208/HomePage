<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロ仕様！画像・図形・文字カスタムアイコンメーカー</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #00ecbc;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            color: #ff9f43;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .workspace {
            display: flex;
            gap: 30px;
            max-width: 1050px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            flex: 1;
            min-width: 340px;
            box-sizing: border-box;
        }

        .control-group {
            margin-bottom: 15px;
            padding: 12px;
            background: #252530;
            border-radius: 8px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #a4b0be;
        }

        .control-group input[type="text"], .control-group select {
            width: 100%;
            padding: 10px;
            background: #121214;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .add-form-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-form-wrapper input[type="text"], .add-form-wrapper select {
            flex: 1;
        }

        .control-group button.btn-add {
            padding: 10px 16px;
            background-color: #00ecbc;
            color: #121214;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff9f43;
        }

        .range-val {
            float: right;
            color: #ff9f43;
            font-size: 0.85rem;
        }

        .selected-badge {
            font-size: 0.9rem;
            color: #ff9f43;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
            background: #121214;
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed #ff9f43;
        }

        .save-zone {
            background: #1a1a24;
            border: 2px solid #ff9f43;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9f43, #ff5252);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
        }
        .btn-save:hover { opacity: 0.9; }
        .btn-save:active { transform: scale(0.98); }

        .btn-delete {
            width: 100%;
            padding: 8px;
            background-color: #ff5252;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }

        .canvas-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #000;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 4px solid #333;
            width: 320px;
            height: 320px;
        }

        canvas {
            display: block;
        }

        .hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #747d8c;
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <h1>🎨 超万能！画像・図形・文字アイコンメーカー</h1>
    <p>横幅・縦幅の個別調整や、図形の追加も自由自在やで！(≧∇≦)b</p>

    <div class="workspace">
        
        <div class="control-panel">
            
            <div class="control-group">
                <label>🎨 アイコン全体の背景色：</label>
                <input type="color" id="bgColor" value="#0f172a" style="width:100%; height:35px; border:none; cursor:pointer;">
            </div>

            <div class="control-group">
                <label>🖼️ 画像をアップロードして追加：</label>
                <input type="file" id="imageUpload" accept="image/*" style="width:100%; color: #ccc; font-size: 0.85rem;">
            </div>

            <div class="control-group">
                <label>🔷 図形を追加：</label>
                <div class="add-form-wrapper">
                    <select id="shapeSelect">
                        <option value="rect">四角形</option>
                        <option value="circle">円</option>
                        <option value="triangle">三角形</option>
                    </select>
                    <button class="btn-add" id="addShapeBtn">図形追加</button>
                </div>
            </div>

            <div class="control-group">
                <label>➕ 文字・絵文字を追加：</label>
                <div class="add-form-wrapper">
                    <input type="text" id="charInput" value="👑" placeholder="文字や絵文字">
                    <button class="btn-add" id="addBtn">文字追加</button>
                </div>
            </div>

            <div class="control-group" style="border: 1px solid #444;">
                <div class="selected-badge" id="selectedLabel">選択中: なし (要素をクリック！)</div>
                
                <div id="colorControls">
                    <label id="colorLabel">① 色（カラー）：</label>
                    <input type="color" id="elementColor" value="#00ecbc" style="width:100%; height:35px; border:none; cursor:pointer; margin-bottom:12px;">
                </div>

                <label id="widthLabel">② 横幅 (Width)：<span class="range-val" id="widthVal">150px</span></label>
                <input type="range" id="widthSlider" min="10" max="600" value="150">

                <div id="heightControlGroup" style="margin-top: 12px;">
                    <label id="heightLabel">③ 縦幅 (Height)：<span class="range-val" id="heightVal">150px</span></label>
                    <input type="range" id="heightSlider" min="10" max="600" value="150">
                </div>

                <label style="margin-top: 12px;">④ 回転角度 (-180° 〜 180°)：<span class="range-val" id="rotateVal">0°</span></label>
                <input type="range" id="rotateSlider" min="-180" max="180" value="0">

                <button class="btn-delete" id="deleteBtn">❌ この要素を消去する</button>
            </div>

            <div class="save-zone">
                <label style="font-size: 0.85rem; font-weight: bold; color: #ff9f43; display: block; margin-bottom: 6px;">💾 保存するPNGのファイル名：</label>
                <input type="text" id="fileNameInput" placeholder="例: my_icon (空欄なら自動命名)">
                <button class="btn-save" id="saveBtn">📥 PNG画像として保存する！</button>
            </div>
        </div>

        <div class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="iconCanvas" width="512" height="512" style="width:320px; height:320px;"></canvas>
            </div>
            <div class="hint">
                【操作方法】<br>
                ✨ **要素をクリック**：選択してカスタム！<br>
                ✨ **要素をドラッグ**：好きな場所に移動 ↕↔<br>
                ✨ **スライダー**：横幅・縦幅・回転を別々に自由自在に調整！
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        const bgColorInput = document.getElementById('bgColor');
        const imageUpload = document.getElementById('imageUpload');
        const shapeSelect = document.getElementById('shapeSelect');
        const addShapeBtn = document.getElementById('addShapeBtn');
        const charInput = document.getElementById('charInput');
        const addBtn = document.getElementById('addBtn');
        const selectedLabel = document.getElementById('selectedLabel');
        const colorControls = document.getElementById('colorControls');
        const colorLabel = document.getElementById('colorLabel');
        const elementColor = document.getElementById('elementColor');
        const widthLabel = document.getElementById('widthLabel');
        const widthSlider = document.getElementById('widthSlider');
        const heightControlGroup = document.getElementById('heightControlGroup');
        const heightLabel = document.getElementById('heightLabel');
        const heightSlider = document.getElementById('heightSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const widthVal = document.getElementById('widthVal');
        const heightVal = document.getElementById('heightVal');
        const rotateVal = document.getElementById('rotateVal');
        const deleteBtn = document.getElementById('deleteBtn');
        const fileNameInput = document.getElementById('fileNameInput');
        const saveBtn = document.getElementById('saveBtn');

        let backgroundColor = '#0f172a';

        // レイヤー管理（文字、画像、図形をすべてサポート！）
        let layers = [
            { id: 1, type: 'text', text: 'A', x: 160, y: 240, width: 220, height: 220, rotation: -15, color: '#ff9f43' },
            { id: 2, type: 'shape', shapeType: 'rect', x: 340, y: 260, width: 180, height: 100, rotation: 15, color: '#00ecbc' }
        ];

        let selectedId = 1; 
        let isDragging = false;
        let dragTarget = null;
        let startX, startY;

        function drawIcon() {
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            layers.forEach(layer => {
                ctx.save();
                ctx.translate(layer.x, layer.y);
                ctx.rotate((layer.rotation * Math.PI) / 180);

                if (layer.type === 'text') {
                    ctx.font = `bold ${layer.width}px 'Helvetica Neue', Arial, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = layer.color;
                    ctx.fillText(layer.text, 0, 0);
                } else if (layer.type === 'image' && layer.imgObj) {
                    // 画像は横幅(width)と縦幅(height)を別々に指定可能！
                    ctx.drawImage(layer.imgObj, -layer.width / 2, -layer.height / 2, layer.width, layer.height);
                } else if (layer.type === 'shape') {
                    ctx.fillStyle = layer.color;
                    if (layer.shapeType === 'rect') {
                        ctx.fillRect(-layer.width / 2, -layer.height / 2, layer.width, layer.height);
                    } else if (layer.shapeType === 'circle') {
                        ctx.beginPath();
                        ctx.ellipse(0, 0, layer.width / 2, layer.height / 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (layer.shapeType === 'triangle') {
                        ctx.beginPath();
                        ctx.moveTo(0, -layer.height / 2);
                        ctx.lineTo(layer.width / 2, layer.height / 2);
                        ctx.lineTo(-layer.width / 2, layer.height / 2);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                // 選択中のガイド表示
                if (layer.id === selectedId) {
                    ctx.beginPath();
                    const maxR = Math.max(layer.width, layer.height) / 1.3;
                    ctx.arc(0, 0, maxR, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 159, 67, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.restore();
            });
        }

        function updateUI() {
            const currentLayer = layers.find(l => l.id === selectedId);
            if (currentLayer) {
                if (currentLayer.type === 'text') {
                    selectedLabel.textContent = `選択中(文字):「${currentLayer.text}」`;
                    colorControls.style.display = 'block';
                    colorLabel.textContent = '① 文字の色：';
                    widthLabel.innerHTML = `② 文字サイズ (フォント)：<span class="range-val" id="widthVal">${currentLayer.width}px</span>`;
                    heightControlGroup.style.display = 'none'; // 文字は縦横比固定
                } else if (currentLayer.type === 'image') {
                    selectedLabel.textContent = `選択中(画像)`;
                    colorControls.style.display = 'none';
                    widthLabel.innerHTML = `② 横幅 (Width)：<span class="range-val" id="widthVal">${currentLayer.width}px</span>`;
                    heightControlGroup.style.display = 'block';
                    heightLabel.innerHTML = `③ 縦幅 (Height)：<span class="range-val" id="heightVal">${currentLayer.height}px</span>`;
                } else if (currentLayer.type === 'shape') {
                    selectedLabel.textContent = `選択中(図形: ${currentLayer.shapeType})`;
                    colorControls.style.display = 'block';
                    colorLabel.textContent = '① 図形の色：';
                    widthLabel.innerHTML = `② 横幅 (Width)：<span class="range-val" id="widthVal">${currentLayer.width}px</span>`;
                    heightControlGroup.style.display = 'block';
                    heightLabel.innerHTML = `③ 縦幅 (Height)：<span class="range-val" id="heightVal">${currentLayer.height}px</span>`;
                }
                
                elementColor.value = currentLayer.color || '#ffffff';
                widthSlider.value = currentLayer.width;
                heightSlider.value = currentLayer.height;
                rotateSlider.value = currentLayer.rotation;
                rotateVal.textContent = `${currentLayer.rotation}°`;
                
                widthSlider.disabled = false;
                heightSlider.disabled = false;
                rotateSlider.disabled = false;
                deleteBtn.disabled = false;
            } else {
                selectedLabel.textContent = `選択中: なし (要素をクリックしてな)`;
                widthVal.textContent = `---`;
                heightVal.textContent = `---`;
                rotateVal.textContent = `---`;
                widthSlider.disabled = true;
                heightSlider.disabled = true;
                rotateSlider.disabled = true;
                deleteBtn.disabled = true;
            }
        }

        // 画像アップロード
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const newLayer = {
                        id: Date.now(),
                        type: 'image',
                        imgObj: img,
                        x: 256,
                        y: 256,
                        width: 200,
                        height: 200,
                        rotation: 0
                    };
                    layers.push(newLayer);
                    selectedId = newLayer.id;
                    imageUpload.value = '';
                    updateUI();
                    drawIcon();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 図形追加
        addShapeBtn.addEventListener('click', () => {
            const shapeType = shapeSelect.value;
            const newLayer = {
                id: Date.now(),
                type: 'shape',
                shapeType: shapeType,
                x: 256,
                y: 256,
                width: 150,
                height: 150,
                rotation: 0,
                color: '#ff9f43'
            };
            layers.push(newLayer);
            selectedId = newLayer.id;
            updateUI();
            drawIcon();
        });

        // 文字追加
        addBtn.addEventListener('click', () => {
            const val = charInput.value.trim();
            if (!val) return;
            const newLayer = {
                id: Date.now(),
                type: 'text',
                text: val,
                x: 256,
                y: 256,
                width: 150,
                height: 150,
                rotation: 0,
                color: '#ffffff'
            };
            layers.push(newLayer);
            selectedId = newLayer.id;
            charInput.value = '';
            updateUI();
            drawIcon();
        });

        bgColorInput.addEventListener('input', (e) => {
            backgroundColor = e.target.value;
            drawIcon();
        });

        // スライダー連動
        function handleSliderInput() {
            const currentLayer = layers.find(l => l.id === selectedId);
            if (currentLayer) {
                currentLayer.width = parseInt(widthSlider.value);
                currentLayer.height = parseInt(heightSlider.value);
                currentLayer.rotation = parseInt(rotateSlider.value);
                if (currentLayer.type !== 'image') {
                    currentLayer.color = elementColor.value;
                }
                
                widthVal.textContent = `${currentLayer.width}px`;
                heightVal.textContent = `${currentLayer.height}px`;
                rotateVal.textContent = `${currentLayer.rotation}°`;
                
                drawIcon();
            }
        }

        elementColor.addEventListener('input', handleSliderInput);
        widthSlider.addEventListener('input', handleSliderInput);
        heightSlider.addEventListener('input', handleSliderInput);
        rotateSlider.addEventListener('input', handleSliderInput);

        deleteBtn.addEventListener('click', () => {
            layers = layers.filter(l => l.id !== selectedId);
            selectedId = layers.length > 0 ? layers[0].id : null;
            updateUI();
            drawIcon();
        });

        // ドラッグ移動
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        function startDrag(e) {
            const coords = getCanvasCoords(e);
            let hitTarget = null;
            for (let i = layers.length - 1; i >= 0; i--) {
                const layer = layers[i];
                const distance = Math.sqrt((coords.x - layer.x) ** 2 + (coords.y - layer.y) ** 2);
                if (distance < Math.max(layer.width, layer.height) / 1.1) {
                    hitTarget = layer;
                    break;
                }
            }
            if (hitTarget) {
                isDragging = true;
                dragTarget = hitTarget;
                selectedId = hitTarget.id;
                startX = coords.x - dragTarget.x;
                startY = coords.y - dragTarget.y;
                updateUI();
                drawIcon();
            }
        }

        function moveDrag(e) {
            if (!isDragging || !dragTarget) return;
            e.preventDefault();
            const coords = getCanvasCoords(e);
            dragTarget.x = coords.x - startX;
            dragTarget.y = coords.y - startY;
            drawIcon();
        }

        function stopDrag() {
            isDragging = false;
            dragTarget = null;
        }

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', stopDrag);
        canvas.addEventListener('touchstart', startDrag);
        canvas.addEventListener('touchmove', moveDrag, { passive: false });
        canvas.addEventListener('touchend', stopDrag);

        // 保存処理
        saveBtn.addEventListener('click', () => {
            const tempSelectedId = selectedId;
            selectedId = null; 
            drawIcon();

            const dataURL = canvas.toDataURL('image/png');
            let inputName = fileNameInput.value.trim();
            let finalFileName = inputName ? `${inputName}.png` : `custom-icon-${Date.now()}.png`;

            const link = document.createElement('a');
            link.download = finalFileName;
            link.href = dataURL;
            link.click();

            selectedId = tempSelectedId;
            drawIcon();
        });

        updateUI();
        drawIcon();
    </script>
</body>
</html>
