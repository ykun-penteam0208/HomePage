<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Neon Emoji Art Studio ✨🎨</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #0d0f18;
            color: #f0f6fc;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(30, 34, 53, 0.75);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        h1 {
            color: #00f2fe;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }
        p {
            color: #8b949e;
            font-size: 14px;
        }
        .control-group {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        input[type="file"] {
            background: #161b22;
            color: #c9d1d9;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            cursor: pointer;
        }
        input[type="number"] {
            width: 70px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #fff;
            text-align: center;
        }
        .btn-copy {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .btn-copy:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        #output-container {
            position: relative;
            margin-top: 25px;
        }
        #output {
            margin: 0;
            font-family: monospace;
            font-size: 7px;
            line-height: 1;
            white-space: pre;
            background: #010409;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
            overflow-x: auto;
            text-align: left;
            display: inline-block;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        #toast {
            margin-top: 10px;
            color: #3fb950;
            font-size: 13px;
            font-weight: bold;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌌 Ver 1.5 Neon Emoji Art Studio 🎨</h1>
        <p>画像をアップロードして、鮮やかで綺麗な絵文字アートを生成しようぜ！(๑>◡<๑)</p>
        
        <div class="control-group">
            <input type="file" id="imageLoader" accept="image/*">
            <div>
                <label>解像度: </label>
                <input type="number" id="resolution" value="45" min="1" max="1000">
            </div>
        </div>

        <div class="control-group">
            <button class="btn-copy" id="copyBtn">📋 絵文字アートをコピーする</button>
        </div>
        <div id="toast"></div>

        <div id="output-container">
            <div id="output">ここにめちゃカワでおしゃれな絵文字アートが表示されるで！👇</div>
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const resolutionInput = document.getElementById('resolution');
        const outputDiv = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        let uploadedImage = null;

        // 赤がオレンジに化けないよう、各色の特徴を厳密に調整したカラーパレット
        const colorPalette = [
            { emoji: "🔴", r: 255, g: 0, b: 0 },       // 完全な赤
            { emoji: "🎄", r: 0, g: 88, b: 45},
            { emoji: "🟠", r: 255, g: 128, b: 0 },    // オレンジ
            { emoji: "🟡", r: 255, g: 240, b: 0 },    // 黄色
            { emoji: "🟢", r: 0, g: 200, b: 0 },      // 緑
            { emoji: "🔵", r: 0, g: 100, b: 255 },    // 青
            { emoji: "💧", r: 160, g: 216, b: 239},
            { emoji: "🟣", r: 148, g: 0, b: 211 },    // 紫
            { emoji: "🚪", r: 187, g: 99, b: 56},
            { emoji: "🪵", r: 204, g: 102, b: 0},
            { emoji: "🟤", r: 139, g: 69, b: 19 },    // 茶色
            { emoji: "⚫", r: 15, g: 15, b: 15 },     // 黒（暗部を潰さない調整）
            {emoji: "⬛", r: 0, g: 0, b: 0},
            {emoji: "🪨", r: 159, g: 160, b: 160},
            { emoji: "⚪", r: 240, g: 240, b: 240 },  // 白
            { emoji: "⬜", r: 255, g: 255, b: 255},
            { emoji: "✋", r: 239, g: 255, b: 0},
            { emoji: "🩷", r: 255, g: 105, b: 180 },  // ピンク
            { emoji: "⭐", r: 255, g: 215, b: 0 },     // ゴールド
            { emoji: "🫟", r: 230, g: 30, b: 40 },
  { emoji: "🍎", r: 235, g: 50, b: 35 },
  { emoji: "🥊", r: 200, g: 15, b: 30 },
  { emoji: "🍊", r: 255, g: 140, b: 0 },
  { emoji: "🎃", r: 245, g: 120, b: 10 },
  { emoji: "🦁", r: 220, g: 140, b: 40 },
  { emoji: "🐥", r: 255, g: 225, b: 40 },
  { emoji: "🍌", r: 250, g: 230, b: 70 },
  { emoji: "🧀", r: 255, g: 195, b: 15 },
  { emoji: "🥦", r: 40, g: 160, b: 60 },
            { emoji: "🤢", r: 113, g: 252, b: 169},
  { emoji: "🌲", r: 15, g: 90, b: 40 },
  { emoji: "☘️", r: 90, g: 205, b: 85 },
  { emoji: "🩵", r: 120, g: 215, b: 245 },
  { emoji: "🧊", r: 165, g: 230, b: 250 },
  { emoji: "🐳", r: 40, g: 160, b: 230 },
  { emoji: "📘", r: 30, g: 80, b: 200 },
  { emoji: "🫐", r: 45, g: 60, b: 140 },
  { emoji: "🪻", r: 160, g: 110, b: 225 },
  { emoji: "🍇", r: 120, g: 40, b: 160 },
  { emoji: "🦄", r: 210, g: 160, b: 230 },
  { emoji: "🌸", r: 255, g: 180, b: 200 },
  { emoji: "🎀", r: 245, g: 90, b: 140 },
  { emoji: "🌺", r: 220, g: 40, b: 110 },
  { emoji: "💩", r: 135, g: 75, b: 35 },
  { emoji: "🌰", r: 160, g: 90, b: 45 },
  { emoji: "🧸", r: 180, g: 115, b: 65 },
  { emoji: "🥔", r: 215, g: 165, b: 110 },
  { emoji: "🍙", r: 245, g: 245, b: 245 },
  { emoji: "☁️", r: 225, g: 235, b: 245 },
  { emoji: "🐘", r: 150, g: 155, b: 165 },
  { emoji: "🦍", r: 60, g: 65, b: 75 },
  { emoji: "🖤", r: 20, g: 20, b: 25 }
        ];

        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    convertImage();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        resolutionInput.addEventListener('input', () => { if(uploadedImage) convertImage(); });

        function convertImage() {
            if (!uploadedImage) return;

            const res = parseInt(resolutionInput.value);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = res;
            canvas.height = res;

            // 輪郭が途切れないように、画像描画時に滑らかさ（アンチエイリアス等）を最適化
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(uploadedImage, 0, 0, res, res);
            
            const imgData = ctx.getImageData(0, 0, res, res).data;
            let resultHTML = "";

            for (let y = 0; y < res; y++) {
                let rowStr = "";
                for (let x = 0; x < res; x++) {
                    const i = (y * res + x) * 4;
                    let pr = imgData[i];
                    let pg = imgData[i+1];
                    let pb = imgData[i+2];
                    
                    // 線の途切れを防ぐため、中間色や輪郭のエッジを強めに立てる補正
                    let closestEmoji = "⚫";
                    let minDistance = 999999;

                    for (let c of colorPalette) {
                        // 目の色判定に近い重み付け（人間の目は緑や赤の変化に敏感なため補正をかける）
                        const dist = Math.sqrt(
                            Math.pow((pr - c.r) * 1.2, 2) +
                            Math.pow((pg - c.g) * 1.0, 2) +
                            Math.pow((pb - c.b) * 0.9, 2)
                        );
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestEmoji = c.emoji;
                        }
                    }

                    rowStr += closestEmoji;
                }
                resultHTML += rowStr + "\n";
            }

            outputDiv.textContent = resultHTML;
        }

        // コピーボタンの処理
        copyBtn.addEventListener('click', () => {
            const textToCopy = outputDiv.textContent;
            if (!textToCopy || textToCopy.includes("ここにめった")) {
                toast.style.color = "#ff7b72";
                toast.textContent = "⚠️ まだアートが生成されてへんで！";
                return;
            }
            navigator.clipboard.writeText(textToCopy).then(() => {
                toast.style.color = "#3fb950";
                toast.textContent = "✨ クリップボードにコピー完了やで！";
                setTimeout(() => { toast.textContent = ""; }, 3000);
            }).catch(err => {
                toast.style.color = "#ff7b72";
                toast.textContent = "❌ コピーに失敗しってもた...";
            });
        });
    </script>

</body>
</html>
